name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen --extra bigwig --extra test
      - run: uv run pytest -q
      - run: uv run python examples/demo/generate_demo.py
      - run: uv run python -m gel_core.cli --config examples/demo/experiment.json
        env:
          PYTHONPATH: packages/gel-core/src
      - run: uv run python scripts/publish_demo_fixture.py
        env:
          PYTHONPATH: packages/gel-core/src
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
