[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gel-core"
version = "0.1.0"
description = "Portable, transparent PRO-seq enhancer candidate screening"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
bigwig = ["numpy>=1.23", "pyBigWig>=0.3.22"]
test = ["pytest>=8"]

[project.scripts]
gel = "gel_core.cli:main"

[tool.setuptools]
package-dir = {"" = "packages/gel-core/src"}

[tool.setuptools.packages.find]
where = ["packages/gel-core/src"]

[tool.pytest.ini_options]
pythonpath = ["packages/gel-core/src"]
testpaths = ["tests"]
